<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#5C4420">
  <title>JFA Bolsas – Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

<header class="top">
  <div class="logo">JFA <span>Bolsas</span> <small>Panel</small></div>
  <nav class="tabs" role="tablist">
    <button data-tab="pedidos" class="active">Pedidos</button>
    <button data-tab="clientes">Clientes</button>
    <button data-tab="precios">Precios</button>
    <button data-tab="caja">Caja</button>
    <button data-tab="datos">Datos</button>
  </nav>
</header>

<main id="app"></main>

<dialog id="dlg">
  <form method="dialog" id="dlg-form"></form>
</dialog>

<div id="toast" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
